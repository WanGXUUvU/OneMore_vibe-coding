<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FB"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="120" x2="1060" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#33C3A1"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="96" r="120" fill="#DDE8FF"/>
  <circle cx="160" cy="588" r="110" fill="#DFF7F1"/>

  <g filter="url(#shadow)">
    <rect x="110" y="72" width="980" height="536" rx="28" fill="white"/>
  </g>

  <text x="140" y="132" fill="#162033" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">
    minipower 极简自适应项目工作流
  </text>
  <text x="140" y="168" fill="#536179" font-family="system-ui, -apple-system, sans-serif" font-size="18">
    专为 AI 编码助手设计的轻量级项目开发与状态治理规范 (支持 5 大主流平台)
  </text>

  <rect x="140" y="208" width="920" height="4" rx="2" fill="url(#accent)"/>

  <!-- 核心流转闭环展示 -->
  <g>
    <rect x="140" y="246" width="920" height="144" rx="22" fill="#F8FBFF" stroke="#D9E6FF" stroke-width="1.5"/>
    <text x="180" y="295" fill="#1E2A42" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">极简自适应流转闭环 (Adaptive Feedback Loop)</text>
    
    <!-- 流程节点 1 -->
    <rect x="180" y="315" width="130" height="42" rx="10" fill="#E8F1FF" stroke="#B0CEFF"/>
    <text x="245" y="341" fill="#0052CC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">需求对齐 (TASK-000)</text>
    
    <!-- 箭头 1 -->
    <path d="M 320 336 L 350 336" stroke="#B0CEFF" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- 流程节点 2 -->
    <rect x="360" y="315" width="130" height="42" rx="10" fill="#EBFBF6" stroke="#A7EED8"/>
    <text x="425" y="341" fill="#006644" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">开发与编码 (coding)</text>

    <!-- 箭头 2 -->
    <path d="M 500 336 L 530 336" stroke="#A7EED8" stroke-width="2"/>

    <!-- 流程节点 3 -->
    <rect x="540" y="315" width="130" height="42" rx="10" fill="#FFF4E5" stroke="#FFD8A8"/>
    <text x="605" y="341" fill="#A05000" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">测试与本地验证</text>

    <!-- 箭头 3 -->
    <path d="M 680 336 L 710 336" stroke="#FFD8A8" stroke-width="2"/>

    <!-- 流程节点 4 -->
    <rect x="720" y="315" width="130" height="42" rx="10" fill="#F3EAFF" stroke="#D3BFFF"/>
    <text x="785" y="341" fill="#5224A3" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">变更归档 (STATUS.md)</text>

    <!-- 箭头 4 -->
    <path d="M 860 336 L 890 336" stroke="#D3BFFF" stroke-width="2"/>

    <!-- 流程节点 5 -->
    <rect x="900" y="315" width="120" height="42" rx="10" fill="#F4F5F7" stroke="#DFE1E6"/>
    <text x="960" y="341" fill="#253858" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">结卡询问 (Loop)</text>
  </g>

  <!-- 支持的 AI 平台展示 (5大平台) -->
  <g>
    <rect x="140" y="430" width="168" height="110" rx="20" fill="#FFF8F0" stroke="#FFE1BC"/>
    <text x="224" y="480" fill="#7A4C00" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Codex</text>
    <text x="224" y="508" fill="#8A6A35" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">AGENTS.md</text>
  </g>

  <g>
    <rect x="328" y="430" width="168" height="110" rx="20" fill="#F8F5FF" stroke="#E1D6FF"/>
    <text x="412" y="480" fill="#4E3B8F" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Claude Code</text>
    <text x="412" y="508" fill="#6D5AA7" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">CLAUDE.md</text>
  </g>

  <g>
    <rect x="516" y="430" width="168" height="110" rx="20" fill="#F3FAFF" stroke="#CFEAFF"/>
    <text x="600" y="480" fill="#0B5E8E" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Copilot</text>
    <text x="600" y="508" fill="#497694" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">copilot-instructions</text>
  </g>

  <g>
    <rect x="704" y="430" width="168" height="110" rx="20" fill="#F2FFF8" stroke="#CFF2DF"/>
    <text x="788" y="480" fill="#15603A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">CodeBuddy</text>
    <text x="788" y="508" fill="#4E7C63" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">CODEBUDDY.md</text>
  </g>

  <g>
    <rect x="892" y="430" width="168" height="110" rx="20" fill="#FFF0F5" stroke="#FFD1E3"/>
    <text x="976" y="474" fill="#A81D52" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Gemini</text>
    <text x="976" y="496" fill="#A81D52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Antigravity</text>
    <text x="976" y="518" fill="#8E4663" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">AGENTS.md</text>
  </g>
</svg>
